name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags, e.g. v0.1.0, v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Prepare build environment
        run: |
          mkdir -p build/beemsms
          # Copy all files into the 'beemsms' folder except for the .github folder and other source-only files
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/beemsms/
          
      - name: Create Zip Archive
        run: |
          cd build
          # This creates a zip with the top-level 'beemsms/' directory intact
          zip -r beemsms-${{ github.ref_name }}.zip beemsms
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/beemsms-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
